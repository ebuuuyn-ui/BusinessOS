{% set accounts = treasury_accounts() %}
<label>Ödeme Hesabı<select name="treasury_account_id" data-expense-account><option value="">Hesap Seçilmemiş</option>{% for account in accounts if account.kind in ['Nakit','Banka','Kredi Kartı'] %}<option value="{{ account.id }}" data-kind="{{ account.kind }}" {{ 'selected' if selected_expense_account|default('') == account.id|string }}>{{ account.name }}</option>{% endfor %}</select><small>Hesap seçildiğinde ödeme şekli hesaba göre güncellenir. Boş bırakırsanız hesap bağlantısı kaldırılır.</small></label>
<script>document.addEventListener('DOMContentLoaded',()=>{for(const field of document.querySelectorAll('[data-expense-account]')){const method=field.closest('form').querySelector('[name="payment_method"]');field.addEventListener('change',()=>{if(field.value)method.value=field.selectedOptions[0].dataset.kind});method.addEventListener('change',()=>{if(field.value&&field.selectedOptions[0].dataset.kind!==method.value)field.value=''})}});</script>
