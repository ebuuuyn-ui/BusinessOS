<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business OS · Giriş</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;color:#1e293b;font:16px system-ui,sans-serif;padding:24px}.card{width:100%;max-width:400px;background:white;border:1px solid #e2e8f0;border-radius:24px;padding:32px;box-shadow:0 16px 48px #1e293b0d}.logo{display:grid;place-items:center;width:52px;height:52px;background:#1684f6;color:white;font-size:30px;font-weight:700;border-radius:16px}h1{font-size:26px;margin:22px 0 8px}p{color:#64748b;line-height:1.6}label{display:block;font-weight:600;margin:20px 0 8px}input,button{width:100%;min-height:48px;border-radius:10px;font:inherit}input{padding:12px;border:1px solid #cbd5e1}input:focus{outline:3px solid #bfdbfe;border-color:#1684f6}button{margin-top:24px;background:#1684f6;border:0;color:white;font-weight:600;cursor:pointer}.error{color:#b91c1c;background:#fef2f2;padding:12px;border-radius:10px}
</style>
</head>
<body><main class="card"><div class="logo">B</div><h1>Business OS</h1>
{% if unavailable %}<p>Web erişimi henüz hazır değil. Kurulum tamamlandığında giriş yapabilirsiniz.</p>
{% else %}<p>Devam etmek için giriş yapın.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('web_login') }}" target="_top">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label for="username">Kullanıcı adı</label><input id="username" name="username" autocomplete="username" required autofocus maxlength="200">
<label for="password">Şifre</label><input id="password" type="password" name="password" autocomplete="current-password" required maxlength="1000">
<button type="submit">Giriş yap</button></form>{% endif %}
</main></body></html>
