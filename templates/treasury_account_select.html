{% set fund_accounts = treasury_accounts() %}{% if fund_accounts %}<label>Paranın Bulunduğu Kasa / Hesap<select name="treasury_account_id" data-fund-select><option value="">Hesap Seçilmemiş</option>{% for a in fund_accounts if a.kind!='Mahsup' %}<option value="{{ a.id }}" data-method="{{ 'Kredi Kartı' if a.kind=='Tahsilat Sistemi' else a.kind }}">{{ a.name }}</option>{% endfor %}</select><small data-fund-note>Nakit, banka veya tahsilat sistemini seçin.</small></label>
<script>document.addEventListener('DOMContentLoaded',()=>{const field=document.querySelector('[data-fund-select]'),method=document.querySelector('[name="payment_method"]'),direct=document.querySelector('[name="direct_to_supplier"]'),note=document.querySelector('[data-fund-note]');if(!field||!method)return;function update(){const isDirect=method.value==='Kredi Kartı'&&direct?.checked;field.disabled=isDirect||method.value==='Çek';for(const o of field.options){o.hidden=!!o.value&&o.dataset.method!==method.value;o.disabled=o.hidden}if(field.selectedOptions[0]?.disabled||field.disabled)field.value='';note.textContent=isDirect?'Tedarikçi aktarımı giriş ve çıkış olarak Mahsup hesabına işlenir.':method.value==='Çek'?'Çek, çek takibinde tutulur.':'Seçilmezse hareket daha sonra Kasalar ekranından bağlanabilir.'}method.addEventListener('change',update);direct?.addEventListener('change',update);update()});</script>{% endif %}
