<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Chat Bağlantısı · Business OS</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main style="max-width:620px;margin:48px auto;padding:24px"><section class="panel form-panel"><h1>Google Chat Bağlantısı</h1>{% if oauth_url %}<p>bekir@abikamobilya.com hesabınızla gönderim iznini tamamlayın.</p><a class="button primary" href="{{ oauth_url }}">Google ile Devam Et</a>{% else %}<p>Google'dan BusinessOS'a döndünüz. Güvenli bağlantıyı tamamlamak için devam edin.</p><form method="post" action="{{ url_for('supplier_chat_callback') }}"><input type="hidden" name="code" value="{{ code }}"><input type="hidden" name="state" value="{{ state }}"><input type="hidden" name="error" value="{{ error }}"><button type="submit" class="button primary">Bağlantıyı Tamamla</button></form>{% endif %}</section></main></body></html>
