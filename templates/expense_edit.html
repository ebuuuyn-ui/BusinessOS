{% extends 'base.html' %}
{% block title %}Masraf Düzenle · Business OS{% endblock %}
{% block heading %}Masrafı Düzenle{% endblock %}{% block subheading %}{{ expense.description }}{% endblock %}
{% block header_action %}<a class="button" href="{{ url_for('expenses') }}">← Masraflara Dön</a>{% endblock %}
{% block content %}
<form method="post" class="panel form-panel expense-edit-panel">
  <div class="form-grid four">
    <label>Tarih *<input type="date" name="expense_date" value="{{ expense.expense_date.isoformat() }}" required></label>
    <label>Kategori *<select name="category" required>{% for category in categories %}<option {{ 'selected' if expense.category == category }}>{{ category }}</option>{% endfor %}</select></label>
    <label>Belge / Fatura No<input name="document_no" value="{{ expense.document_no or '' }}"></label>
    <label>Ödenen Kişi / Firma<input name="payee" value="{{ expense.payee or '' }}"></label>
    <label class="span-two">Açıklama *<input name="description" value="{{ expense.description }}" required></label>
    <label>Ödeme Şekli *<select name="payment_method" required>{% for method in payment_methods %}<option {{ 'selected' if expense.payment_method == method }}>{{ method }}</option>{% endfor %}</select></label>
    <label>Tutar (₺) *<input type="number" name="amount" min="0.01" step="0.01" value="{{ expense.amount }}" onfocus="this.select()" required></label>
  </div>
  <div class="actions"><a class="button" href="{{ url_for('expenses') }}">Vazgeç</a><button class="button primary" type="submit">Değişiklikleri Kaydet</button></div>
</form>
{% endblock %}
